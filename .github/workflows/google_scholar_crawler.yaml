name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * 1'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar citation data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          if [[ -z "$GOOGLE_SCHOLAR_ID" ]]; then
            echo '::error::Configure the GOOGLE_SCHOLAR_ID repository secret.'
            exit 1
          fi
          python main.py

      - name: Publish citation data
        run: |
          branch=google-scholar-stats
          publish_dir=$(mktemp -d)
          remote_branch=$(git ls-remote origin "refs/heads/$branch")
          if [[ -n "$remote_branch" ]]; then
            git fetch --no-tags --depth=1 origin "refs/heads/$branch"
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            git worktree add --orphan -b "$branch" "$publish_dir"
          fi

          cp google_scholar_crawler/results/{gs_data,gs_data_shieldsio}.json "$publish_dir/"
          cd "$publish_dir"
          git add -- gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data is unchanged.'
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update citation data'
          git push origin "HEAD:refs/heads/$branch"
